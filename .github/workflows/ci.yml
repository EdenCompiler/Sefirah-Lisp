name: Integration

on:
  push:
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        system: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.system }}
    steps:
      - uses: actions/checkout@v6
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev
      - name: Configure
        run: cmake -S . -B construir -DCMAKE_BUILD_TYPE=Debug -DSEFIRAH_AVISOS_COMO_ERROS=ON
      - name: Build
        run: cmake --build construir --config Debug --parallel
      - name: Test
        run: ctest --test-dir construir -C Debug --output-on-failure
      - name: Install
        run: cmake --install construir --config Debug --prefix "${{ runner.temp }}/sefirah-install"
      - name: Verify installation
        run: cmake -DSEFIRAH_PREFIXO="${{ runner.temp }}/sefirah-install" -P cmake/verificar_instalacao.cmake
